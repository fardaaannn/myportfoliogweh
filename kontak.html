<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hubungi Fardan Azzuhri - Web Developer" />
    <title>Kontak | Fardan.Dev</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <section class="page-header">
      <h1>📬 Hubungi Aku</h1>
      <p>Ada pertanyaan atau ingin berkolaborasi? Kirim pesan!</p>
    </section>
    
    <div class="kontainer-utama contact-layout">
      <!-- Contact Form Card -->
      <div class="kartu-ios contact-form-card">
        <h3>✉️ Kirim Pesan</h3>
        <form>
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input
              type="text"
              id="nama"
              placeholder="Masukkan nama lengkap"
              required
            />
            <span class="error-message"></span>
          </div>
          <div class="form-group">
            <label for="pesan">Pesan</label>
            <textarea
              id="pesan"
              placeholder="Tulis pesanmu di sini..."
              required
            ></textarea>
            <span class="error-message"></span>
          </div>
          <button type="submit">Kirim via WhatsApp 📱</button>
        </form>
      </div>
      
      <!-- Contact Info Card -->
      <div class="kartu-ios">
        <h3>📍 Informasi Kontak</h3>
        <div class="contact-info">
          <div class="contact-item">
            <span class="contact-icon">📧</span>
            <div>
              <strong>Email</strong>
              <p>fardaaannn@gmail.com</p>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-icon">📍</span>
            <div>
              <strong>Lokasi</strong>
              <p>Indonesia</p>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-icon">⏰</span>
            <div>
              <strong>Jam Respon</strong>
              <p>Senin - Jumat, 09:00 - 17:00</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    

    <script src="components.js"></script>
    <script src="script.js"></script>
  </body>
</html>
